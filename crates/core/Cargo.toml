[package]
name = "contextd-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
cpal = "0.15"
transcribe-cpp = { version = "0.3.1", default-features = false }
directories = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
hound = "3.5"
axum = "0.8"
fs2 = "0.4"
llama-cpp-2 = { version = "0.1.159", default-features = false, features = ["common"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
transcribe-cpp = { version = "0.3.1", default-features = false, features = ["metal"] }
llama-cpp-2 = { version = "0.1.159", default-features = false, features = ["common", "metal"] }
